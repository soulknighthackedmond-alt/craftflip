services:
  craftflip:
    build: .
    container_name: craftflip
    restart: unless-stopped
    ports:
      - "8789:8789"
    environment:
      PORT: "8789"
      DATA_DIR: /data
      INDEX_TTL_SECONDS: "300"
      FLIPS_TTL_SECONDS: "30"
      DONUT_FEE_PERCENT: "0"
      REQUEST_SPACING_SECONDS: "0.25"
      # the sell side fills in slowly behind the price index: one request per item
      SALES_TTL_SECONDS: "3600"
      SALES_SPACING_SECONDS: "1.0"
      SALES_MAX_PER_CYCLE: "600"
      # player buy orders, recorded through /api/orders. There is no public feed for
      # them, so this is a table you fill from what /orders shows in game. It is
      # written to the volume below, so it survives a redeploy of the image, and
      # orders older than the TTL are shown but never counted as easy money.
      ORDERS_TTL_HOURS: "24"
      ORDERS_PATH: /data/orders.json
    volumes:
      # flip history lives here; the recipe dataset is baked into the image
      - craftflip-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8789/health',timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  craftflip-data:
